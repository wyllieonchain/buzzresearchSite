<svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Bee body -->
  <ellipse cx="12" cy="12" rx="6" ry="4" fill="#FFD700" stroke="#FFA500" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bee stripes -->
  <line x1="9" y1="12" x2="15" y2="12" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="8" y1="10" x2="16" y2="10" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="8" y1="14" x2="16" y2="14" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Wings -->
  <ellipse cx="9" cy="10" rx="2" ry="3" fill="#FFD700" opacity="0.6"/>
  <ellipse cx="15" cy="10" rx="2" ry="3" fill="#FFD700" opacity="0.6"/>
  <!-- Antennae -->
  <line x1="10" y1="8" x2="9" y2="5" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="8" x2="15" y2="5" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="9" cy="4" r="0.8" fill="#000"/>
  <circle cx="15" cy="4" r="0.8" fill="#000"/>
  <!-- Stinger -->
  <path d="M18 12 L20 14" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
</svg>

